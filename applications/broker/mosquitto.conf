# Mosquitto do ESP32 Wi-Fi IDS (spec §3 e §7). Rodar a partir desta pasta: ./start_broker.sh
# Escuta em todas as interfaces na porta 1883 porque o IP do PC na LAN/hotspot pode mudar.
# Só aceita usuários autenticados e cada um só acessa os próprios tópicos (acl).
# NÃO abrir esta porta para a internet (sem port forwarding no roteador).

per_listener_settings false
listener 1883
allow_anonymous false
password_file passwd
acl_file acl

# Status retido fica só em memória: reiniciar o broker apaga o último status (o ESP32 republica em até 30 s).
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S
