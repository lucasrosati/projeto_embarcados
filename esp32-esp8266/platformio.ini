; Permite compilar/gravar o firmware ESP-IDF pelo PlatformIO (VS Code).
; O projeto continua sendo ESP-IDF: idf.py também funciona nesta pasta.
[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
board_build.partitions = partitions_singleapp_large.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
